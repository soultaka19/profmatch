services:
  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* est inliné dans les bundles au moment de `next build` :
      # la valeur doit donc être fournie au build (ARG du Dockerfile), pas
      # seulement à l'exécution. Adapter si l'API n'est pas sur localhost:8000.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-profmatch}:${POSTGRES_PASSWORD:-profmatch}@db:5432/${POSTGRES_DB:-profmatch}
      REDIS_URL: redis://redis:6379/0
      UPLOADS_DIR: /uploads
      CELERY_ALWAYS_EAGER: "false"
      # Mode démo/jury : crée les 3 comptes prof/rh/admin au démarrage
      # (idempotent, voir entrypoint.sh). Mettre "false" hors démo.
      SEED_DEMO_ACCOUNTS_ON_START: "true"
    volumes:
      - profmatch_uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-profmatch}:${POSTGRES_PASSWORD:-profmatch}@db:5432/${POSTGRES_DB:-profmatch}
      REDIS_URL: redis://redis:6379/0
      UPLOADS_DIR: /uploads
      CELERY_ALWAYS_EAGER: "false"
    volumes:
      - profmatch_uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Les migrations Alembic sont appliquées par l'entrypoint du backend :
      # le worker attend que le backend soit sain pour ne pas travailler sur
      # un schéma incomplet.
      backend:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-profmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-profmatch}
      POSTGRES_DB: ${POSTGRES_DB:-profmatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-profmatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  profmatch_uploads:
