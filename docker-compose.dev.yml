# Surcharges pour le développement local (hot-reload)
# Usage : docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"

  worker:
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: deps
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
